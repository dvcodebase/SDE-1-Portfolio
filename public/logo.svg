<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72">
  <!-- Background -->
  <rect x="4" y="4" width="64" height="64" rx="12" fill="#0d0d0d"/>

  <!-- D glyph: vertical stem + curved back -->
  <path
    d="M20 16 L20 56 Q20 56 36 56 Q56 56 56 36 Q56 16 36 16 Z"
    fill="none"
    stroke="#f5f3ee"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Orange accent dot on the stem midpoint — the "." in "Dheeraj" / "dv" -->
  <circle cx="20" cy="36" r="5" fill="#c8410a"/>
</svg>
